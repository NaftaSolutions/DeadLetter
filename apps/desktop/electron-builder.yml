appId: dev.naftasolutions.deadletter
productName: DeadLetter
directories:
  buildResources: build
  output: dist
# The renderer and main are already bundled into out/. Only the native engine package is a
# runtime dependency, so nothing else from node_modules is shipped.
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!**/node_modules/@deadletter/engine/{src,build.rs,Cargo.toml}'
asar: true
asarUnpack:
  - '**/*.node'
# Chromium locale packs are ~45 MB; the UI is English only.
electronLanguages:
  - en-US
compression: maximum
npmRebuild: false
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  icon: build/icon.png
linux:
  target: AppImage
  icon: build/icon.png
  category: Development
