[package]
name = "engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/NaftaSolutions/DeadLetter"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4", "tokio_rt"] }
napi-derive = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "gzip", "deflate", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
serde_norway = "0.9.42"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tokio = { version = "1.54.1", features = ["sync", "macros", "time"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }

[build-dependencies]
napi-build = "2"
