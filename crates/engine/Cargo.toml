[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4", "tokio_rt"] }
napi-derive = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "gzip", "deflate", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
serde_norway = "0.9.42"

[build-dependencies]
napi-build = "2"
